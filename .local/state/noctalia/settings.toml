config_version = 8

[audio]
enable_sounds = true

[backdrop]
blur_intensity = 0.19999999552965164
enabled = true

[bar.default]
capsule = true
center = [ "media", "clock", "session" ]
contact_shadow = true
end = [ "shelly", "tray", "group:g1", "group:g2" ]
layer = "overlay"
reserve_space = false
smart_auto_hide = true
start = [ "group:g3", "active_window" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "todo", "clipboard", "notifications" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "workspaces", "Overview" ]
    opacity = 1.0
    padding = 6.0

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

[control_center]
sidebar = "full"

    [control_center.calendar]
    show_events_card = false

