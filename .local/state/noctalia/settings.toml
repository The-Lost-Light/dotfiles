[dock]
enabled = true
icon_size = 36
launcher_icon = "rocket"
launcher_position = "start"
pinned = [ "helium", "org.gnome.Nautilus", "dev.zed.Zed", "kitty" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 900.0

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
enabled = true
schema_version = 1
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 1024.0
    cy = 983.5
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 229.0
    box_width = 720.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 144.0
    box_width = 304.0
    cx = 1024.0
    cy = 184.0
    output = "DP-1"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background_opacity = 0.59999999999999998
        center_text = false
        clock_style = "digital"
        shadow = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1796.0
    cy = 130.0
    output = "DP-1"
    rotation = 0.0
    type = "weather"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1805.0
    cy = 1014.0
    output = "DP-1"
    rotation = 0.0
    type = "media_player"

[nightlight]
enabled = true

[notification]
layer = "overlay"

[osd]
position = "bottom_center"

[plugin_settings."noctalia/translator"]
target_lang = "en"

[plugin_settings."nzlov/daily-wallpaper"]
source = "nasa"

[plugins]
enabled = [ "lucasoe/proton-pass", "noctalia/timer", "nightwatch75/todo", "ramosdetrigo/godot-provider", "joshuaslate/shelly" ]

[shell]
avatar_path = "/home/mono/.avatar.webp"
clipboard_confirm_clear_history = false
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = true

    [shell.panel]
    open_near_click_control_center = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    confirm_region = true

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "Noctalia legacy"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper]
directory = "/home/mono/.config/niri/assets"

    [wallpaper.default]
    path = "/home/mono/.config/niri/assets/wallpaper.jpg"

    [wallpaper.last]
    path = "/home/mono/.config/niri/assets/wallpaper.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/mono/.config/niri/assets/wallpaper.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/mono/.config/niri/assets/wallpaper.jpg"

[widget.Overview]
glyph = "rectangle"
type = "custom_button"

    [widget.Overview.actions]
    left = "exec niri msg action toggle-overview"
    scroll_down = "exec niri msg action focus-column-right"
    scroll_up = "exec niri msg action focus-column-left"

[widget.active_window]
title_scroll = "on_hover"

[widget.cat]
type = "noctalia/bongocat:cat"

[widget.clock]
anchor = true

[widget.media]
hide_artist = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.session]
capsule = true

[widget.shelly]
bar_label = "count_only"
hide_when_up_to_date = true
type = "joshuaslate/shelly:shelly"

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.tray]
drawer = true
drawer_columns = 5
match_adjacent_spacing = true
pinned = [ "Fcitx", "Vesktop", "steam" ]

[widget.workspaces]
display = "none"
hide_when_empty = true