name = "Mono"
email = "monotone1427@gmail.com"

[signing]
behavior = "own"
backend = "ssh"
key = "~/.ssh/id_ed25519.pub"

[ui]
default-command = "log"
pager = "delta"
diff-formatter = ":git"

[aliases]
all.definition = ["log", "--revision", "visible() | remote_bookmarks()"]
all.doc = "Show all logs"
top.definition = ["edit", "heads(@::)"]
top.doc = "edit Head"
